<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mi Loba Su Lobo ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #090914;
            transition: background-color 0.8s ease;
        }

        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        /* --- PANTALLA 1: ELEGANTE --- */
        .intro-screen {
            position: relative;
            padding: 40px 24px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(18, 14, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease forwards;
        }

        .intro-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background-image: url("foto-mi-loba-su-lobo.jpg");
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            filter: brightness(0.35) contrast(1.1);
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #f4c6da;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .intro-title {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 16px;
            line-height: 1.25;
        }

        .intro-title span {
            font-family: Georgia, serif;
            font-style: italic;
            color: #f3b7d1;
        }

        .rule {
            width: 54px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #f3b7d1, transparent);
            margin: 0 auto 20px;
        }

        .subtitle {
            font-size: 14px;
            color: #f2c9db;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .signature {
            font-size: 10px;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(255, 245, 250, 0.86);
            margin-bottom: 20px;
        }

        /* Reproductor de YouTube */
        .youtube-box {
            margin: 15px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(243, 183, 209, 0.3);
        }

        .youtube-box iframe {
            width: 100%;
            height: 120px;
            border: none;
            display: block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #C25B75, #A84B62);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(194, 91, 117, 0.4);
            font-size: 15px;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        /* --- PANTALLA 2: CARTA ROSA Y CREMA --- */
        .letter-screen {
            display: none;
            background: #ffffff;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(194, 91, 117, 0.15);
            border: 2px solid #E8A598;
            animation: fadeIn 0.8s ease forwards;
        }

        .photo-frame {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #E8A598;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .letter-title {
            font-family: 'Caveat', cursive;
            font-size: 30px;
            color: #C25B75;
            margin-bottom: 20px;
        }

        .letter-body {
            font-size: 15px;
            line-height: 1.7;
            color: #4A3B43;
            text-align: left;
            white-space: pre-line;
        }

        .footer-heart {
            margin-top: 25px;
            font-size: 22px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

        <!-- PANTALLA 1 -->

            <div class="eyebrow">Mi Loba Su Lobo</div>
